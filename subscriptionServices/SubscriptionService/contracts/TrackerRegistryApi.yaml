openapi: 3.1.0
info:
  title: SubscriptionService Tracker Registry API
  version: 1.0.0
paths:
  /internal/trackers:
    post:
      summary: Register a tracker and its supportedHosts
      responses:
        "204":
          description: Registered
        "409":
          description: Conflicting supported host or tracker
  /internal/trackers/{trackerId}/availability:
    put:
      summary: Confirm that the tracker is still available
      parameters:
        - name: trackerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Availability confirmation renewed
  /internal/trackers/{trackerId}:
    delete:
      summary: Deregister a tracker
      parameters:
        - name: trackerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deregistered
