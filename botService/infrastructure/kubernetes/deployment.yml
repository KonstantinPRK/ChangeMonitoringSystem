apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot-service
  template:
    metadata:
      labels:
        app: bot-service
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: bot-service
          image: change-monitoring-system/bot-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bot-service-config
            - secretRef:
                name: bot-service-secrets
          ports:
            - name: http
              containerPort: 8081
            - name: management
              containerPort: 9081
          startupProbe:
            httpGet:
              path: /health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: management
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: management
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir: {}
