openapi: 3.1.0
info:
  title: SubscriptionService data API
  version: 1.0.0
  description: Trusted internal API. Register clients through the separate BotRegistryApi and TrackerRegistryApi contracts.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/subscriptions/requests:
    post:
      operationId: submitSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/subscriptions/requests/batch:
    post:
      operationId: submitSubscriptionBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '202':
          description: Entire batch durably accepted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/subscriptions/requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: subscriptionStatus
      responses:
        '200':
          description: Current inbox processing status, not downstream delivery acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/subscriptions:
    get:
      operationId: listSubscriptions
      parameters:
        - {name: botId, in: query, required: true, schema: {type: string, maxLength: 128}}
        - {name: userId, in: query, required: true, schema: {type: string, maxLength: 128}}
        - {name: chatId, in: query, required: true, schema: {type: string, maxLength: 128}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: Subscription page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
  /api/v1/subscriptions/available:
    get:
      operationId: supportedHosts
      responses:
        '200':
          description: Registered hosts, including temporarily unavailable trackers
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
  /api/v1/updates:
    post:
      operationId: submitUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkNotification'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/updates/{eventId}:
    parameters:
      - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: updateStatus
      responses:
        '200':
          description: Event processing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/trackers/{trackerId}/links:
    get:
      operationId: activeTrackerLinks
      parameters:
        - {name: trackerId, in: path, required: true, schema: {type: string}}
        - {name: afterId, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: Active links for this tracker's hosts, ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, link, revision]
                  properties:
                    id: {type: integer, format: int64}
                    link: {$ref: '#/components/schemas/Link'}
                    revision: {type: integer, format: int64}
components:
  schemas:
    User:
      type: object
      required: [botId, userId, chatId]
      properties:
        botId: {type: string, minLength: 1, maxLength: 128}
        userId: {type: string, minLength: 1, maxLength: 128}
        chatId: {type: string, minLength: 1, maxLength: 128}
    Link:
      type: object
      required: [domain, address]
      properties:
        domain: {type: string, minLength: 1, maxLength: 253}
        address: {type: string, format: uri, minLength: 1, maxLength: 2048}
    Subscription:
      type: object
      required: [link, tags, filters]
      properties:
        link: {$ref: '#/components/schemas/Link'}
        tags: {$ref: '#/components/schemas/Metadata'}
        filters: {$ref: '#/components/schemas/Metadata'}
    Metadata:
      type: array
      maxItems: 20
      items: {type: string, minLength: 1, maxLength: 256}
    SubscriptionRequest:
      type: object
      required: [requestId, actionType, user, link]
      properties:
        requestId: {type: string, format: uuid}
        actionType: {type: string, enum: [SAVE, DELETE]}
        user: {$ref: '#/components/schemas/User'}
        link: {$ref: '#/components/schemas/Link'}
        tags: {$ref: '#/components/schemas/Metadata'}
        filters: {$ref: '#/components/schemas/Metadata'}
    LinkNotification:
      type: object
      required: [eventId, trackerId, link, message, occurredAt]
      properties:
        eventId: {type: string, format: uuid}
        trackerId: {type: string, minLength: 1, maxLength: 128}
        link: {$ref: '#/components/schemas/Link'}
        message: {type: string, minLength: 1, maxLength: 10000}
        occurredAt: {type: string, format: date-time}
    Receipt:
      type: object
      required: [requestId, status, attempts]
      properties:
        requestId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED]}
        attempts: {type: integer, minimum: 0}
        error: {type: [string, 'null']}
    TrackerRequest:
      type: object
      required: [requestId, actionType, link, revision]
      properties:
        requestId: {type: string, format: uuid}
        actionType: {type: string, enum: [SAVE, DELETE]}
        link: {$ref: '#/components/schemas/Link'}
        revision: {type: integer, format: int64, minimum: 1}
    BotNotification:
      type: object
      required: [notificationId, eventId, user, link, message, occurredAt]
      properties:
        notificationId: {type: string, format: uuid}
        eventId: {type: string, format: uuid}
        user: {$ref: '#/components/schemas/User'}
        link: {$ref: '#/components/schemas/Link'}
        message: {type: string}
        occurredAt: {type: string, format: date-time}
  responses:
    Accepted:
      description: Durably accepted; retries must preserve ID and content
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Receipt'}
    Invalid:
      description: Invalid JSON, URL or fields
    NotFound:
      description: Unknown request, bot, tracker or host
    Conflict:
      description: Message ID already used with another payload, or ownership conflict
    Unavailable:
      description: Database unavailable or service lease expired
