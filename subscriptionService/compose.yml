name: subscription-service

services:
  subscription-postgres:
    container_name: subscription-postgres
    image: postgres:17.8-alpine
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export POSTGRES_DB="$$SUBSCRIPTION_DB_NAME"
        export POSTGRES_USER="$$SUBSCRIPTION_DB_USER"
        export POSTGRES_PASSWORD="$$SUBSCRIPTION_DB_PASSWORD"
        exec /usr/local/bin/docker-entrypoint.sh postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - subscription-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$SUBSCRIPTION_DB_USER -d $$SUBSCRIPTION_DB_NAME"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

  subscription-redis:
    container_name: subscription-redis
    image: redis:8.6-alpine
    env_file:
      - .env
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$SUBSCRIPTION_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - subscription-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$SUBSCRIPTION_REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

  kafka-storage-init:
    container_name: kafka-storage-init
    image: apache/kafka-native:4.1.2
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 1000:1000 /var/lib/kafka/data"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: "no"

  kafka:
    container_name: kafka
    image: apache/kafka-native:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 19092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  subscription-service:
    container_name: subscription-service
    image: change-monitoring-system/subscription-service:local
    build:
      context: .
    env_file:
      - .env
    environment:
      SUBSCRIPTION_DB_HOST: subscription-postgres
      SUBSCRIPTION_DB_PORT: 5432
      SUBSCRIPTION_REDIS_HOST: subscription-redis
      SUBSCRIPTION_REDIS_PORT: 6379
      SUBSCRIPTION_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SUBSCRIPTION_HTTP_HOST: 0.0.0.0
      SUBSCRIPTION_MANAGEMENT_HOST: 0.0.0.0
      SUBSCRIPTION_MANAGEMENT_PORT: 9080
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9080:9080"
    depends_on:
      subscription-postgres:
        condition: service_healthy
      subscription-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9080/health/liveness >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 150s
    init: true
    restart: unless-stopped
    stop_grace_period: 60s

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      subscription-service:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana-oss:13.0.2
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export GF_SECURITY_ADMIN_USER="$$GRAFANA_ADMIN_USER"
        export GF_SECURITY_ADMIN_PASSWORD="$$GRAFANA_ADMIN_PASSWORD"
        exec /run.sh
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  default:
    name: change-monitoring-system-network
    external: true

volumes:
  subscription-postgres-data:
    name: change-monitoring-system_subscription-postgres-data
  subscription-redis-data:
    name: change-monitoring-system_subscription-redis-data
  kafka-data:
    name: change-monitoring-system_kafka-data
  prometheus-data:
    name: change-monitoring-system_prometheus-data
  grafana-data:
    name: change-monitoring-system_grafana-data
