apiVersion: v1
kind: ConfigMap
metadata:
  name: tracker-service-config
data:
  TRACKER_SERVICE_ID: TrackerService
  TRACKER_SERVICE_BASE_URL: http://tracker-service:8082
  TRACKER_SERVICE_HTTP_PORT: "8082"
  TRACKER_SERVICE_MANAGEMENT_PORT: "9082"
  TRACKER_SERVICE_DB_HOST: postgres
  TRACKER_SERVICE_DB_PORT: "5432"
  TRACKER_SERVICE_DB_NAME: tracker_service
  TRACKER_SERVICE_DB_USER: tracker_service
  TRACKER_SERVICE_REDIS_HOST: redis
  TRACKER_SERVICE_REDIS_PORT: "6379"
  TRACKER_SERVICE_REDIS_DATABASE: "0"
  GITHUB_SUPPORTED_HOSTS: github.com,www.github.com
  STACK_OVERFLOW_SUPPORTED_HOSTS: stackoverflow.com,www.stackoverflow.com
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  TRACKER_UPDATE_TOPIC: subscription.updates
  MESSAGE_TRANSPORT: HTTP
  SUBSCRIPTION_SERVICE_BASE_URL: http://subscription-service:8080
