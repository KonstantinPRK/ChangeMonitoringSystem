name: changemonitoringsystem

services:
  changedetectionbotpostgres:
    image: postgres:17
    env_file:
      - ../../../bots/ChangeDetectionBot/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - changedetectionbotpostgresdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

  updatetrackingsystembotpostgres:
    image: postgres:17
    env_file:
      - ../../../bots/UpdateTrackingSystemBot/.env
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - updatetrackingsystembotpostgresdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

  githubtrackerpostgres:
    image: postgres:17
    env_file:
      - ../../../trackers/GitHubTracker/.env
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - githubtrackerpostgresdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

  stackoverflowtrackerpostgres:
    image: postgres:17
    env_file:
      - ../../../trackers/StackOverflowTracker/.env
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - stackoverflowtrackerpostgresdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

  changedetectionbotredis:
    image: redis:8.10.1-alpine
    env_file:
      - ../../../bots/ChangeDetectionBot/.env
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - changedetectionbotredisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 10

  updatetrackingsystembotredis:
    image: redis:8.10.1-alpine
    env_file:
      - ../../../bots/UpdateTrackingSystemBot/.env
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - updatetrackingsystembotredisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  changedetectionbotpostgresdata:
  updatetrackingsystembotpostgresdata:
  githubtrackerpostgresdata:
  stackoverflowtrackerpostgresdata:
  changedetectionbotredisdata:
  updatetrackingsystembotredisdata:
