openapi: 3.1.0
info:
  title: SubscriptionService Bot Registry API
  version: 1.0.0
paths:
  /internal/bots:
    post:
      summary: Register the unique bot identified by botId
      responses:
        "204":
          description: Registered
        "409":
          description: Registration conflict
  /internal/bots/{botId}/availability:
    put:
      summary: Confirm that the bot is still available
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Availability confirmation renewed
  /internal/bots/{botId}:
    delete:
      summary: Deregister a bot
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deregistered
