spring:
  application:
    name: SubscriptionService
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${SUBSCRIPTION_DB_HOST:localhost}:${SUBSCRIPTION_DB_PORT:5437}/${SUBSCRIPTION_DB_NAME:${POSTGRES_DB:subscription_service}}
    username: ${SUBSCRIPTION_DB_USER:${POSTGRES_USER:subscription_service}}
    password: ${SUBSCRIPTION_DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: ${SUBSCRIPTION_DB_POOL_SIZE:10}
      connection-timeout: 5000
      data-source-properties:
        socketTimeout: 20
        connectTimeout: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      client-type: jedis
      host: ${SUBSCRIPTION_REDIS_HOST:localhost}
      port: ${SUBSCRIPTION_REDIS_PORT:6381}
      password: ${SUBSCRIPTION_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      database: ${SUBSCRIPTION_REDIS_DATABASE:0}
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${SUBSCRIPTION_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: subscription-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    listener:
      ack-mode: record
  task:
    scheduling:
      pool:
        size: 4
      shutdown:
        await-termination: true
        await-termination-period: 30s
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: ${SUBSCRIPTION_HTTP_HOST:127.0.0.1}
  port: ${SUBSCRIPTION_HTTP_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  server:
    address: ${SUBSCRIPTION_MANAGEMENT_HOST:127.0.0.1}
    port: ${SUBSCRIPTION_MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: SubscriptionService
    distribution:
      percentiles-histogram:
        http.server.requests: true
        subscription.delivery.duration: true

app:
  message-transport: ${SUBSCRIPTION_MESSAGE_TRANSPORT:HTTP}
  internal-api-token: ${SUBSCRIPTION_INTERNAL_API_TOKEN:}
  cache:
    ttl: ${SUBSCRIPTION_REDIS_TTL_SECONDS:300}s
  registration:
    availability-timeout: ${REMOTE_AVAILABILITY_TIMEOUT_SECONDS:30}s
  http:
    connect-timeout: ${OUTBOUND_CONNECT_TIMEOUT_SECONDS:5}s
    request-timeout: ${OUTBOUND_REQUEST_TIMEOUT_SECONDS:10}s
  queue:
    batch-size: ${SUBSCRIPTION_QUEUE_BATCH_SIZE:32}
    lease-seconds: ${SUBSCRIPTION_QUEUE_LEASE_SECONDS:60}
    poll-interval: ${SUBSCRIPTION_QUEUE_POLL_INTERVAL:1s}
  kafka:
    update-topic: ${SUBSCRIPTION_KAFKA_UPDATE_TOPIC:subscription.updates}
    notification-topic: ${SUBSCRIPTION_KAFKA_NOTIFICATION_TOPIC:subscription.notifications}
    dlq-topic: ${SUBSCRIPTION_KAFKA_DLQ_TOPIC:subscription.updates.dlq}
    group-id: subscription-service
    publish-timeout: 10s
