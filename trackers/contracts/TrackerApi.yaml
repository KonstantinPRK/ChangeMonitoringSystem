openapi: 3.1.0
info:
  title: Tracker API
  version: 1.0.0
paths:
  /subscriptions:
    get:
      summary: List subscriptions for an opaque recipient address
      responses:
        "200":
          description: Subscription list
    post:
      summary: Add a subscription
      responses:
        "201":
          description: Created
        "409":
          description: Already exists
    delete:
      summary: Delete a subscription
      responses:
        "204":
          description: Deleted

